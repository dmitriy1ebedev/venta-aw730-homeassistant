name: Bug report / Ошибка
description: Report a reproducible Venta AW730 issue
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, pairing data, serial numbers, IP addresses and account details from logs and screenshots.
        Удалите ключи, токены, данные сопряжения, серийные номера, адреса и данные аккаунта из логов и снимков экрана.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.3"
    validations:
      required: true
  - type: input
    id: localtuya_version
    attributes:
      label: LocalTuya version
    validations:
      required: true
  - type: input
    id: venta_version
    attributes:
      label: Venta extension version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: venta_model
    attributes:
      label: Device model
      description: Only AW730 Tuya 3.4 is currently verified; other models need evidence.
      options:
        - AW730 (Smart Life / Tuya)
        - AW735 (unverified)
        - Other Venta model (unverified)
    validations:
      required: true
  - type: input
    id: tuya_protocol
    attributes:
      label: Tuya LAN protocol (if known)
      placeholder: "3.4 / unknown"
    validations:
      required: false
  - type: input
    id: firmware_version
    attributes:
      label: Device firmware VERSION only (optional)
      description: Never include device ID, serial number, local key or account identifiers.
    validations:
      required: false
  - type: dropdown
    id: affected
    attributes:
      label: Affected layer
      options:
        - Device / Tuya LAN
        - LocalTuya
        - Home Assistant / Marketplace
        - Apple Home / Siri
        - Alice / Yandex
        - Dashboard
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (no destructive resets)
      description: Give the initial state, reproducible steps, and whether the issue is visible directly in Home Assistant before Apple Home/Yandex.
      placeholder: |
        1. Starting state (power/mode, no IDs or IPs): ...
        2. Action in Home Assistant: ...
        3. Expected result and observed state: ...
        4. When it started (after update/restart?): ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (redacted logs only)
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: Optional redacted diagnostic JSON / Необязательный обезличенный отчёт
      description: Use Developer Tools → Actions → venta_homekit_native.log_diagnostics if available; do not attach a backup or raw registry. / Не прикладывайте резервные копии и реестры.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed local keys, tokens, private IP/MAC and pairing information.
          required: true
