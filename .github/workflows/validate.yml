name: Validate Venta AW730

on:
  push:
    branches: [main, 'release/1.0.5']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.2,<7"
      - name: Syntax, unit tests and repository structure
        run: |
          python -m compileall -q custom_components tests scripts
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Validate optional dashboard JavaScript
        run: |
          node --input-type=module --check < extras/dashboard/venta-airwasher-card.js
          node --input-type=module --check < extras/dashboard/venta-more-info.js

  hacs:
    name: HACS / Marketplace validation
    # GitVerse has no usable GitHub token for this GitHub-only metadata check.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # pinned main at 2026-11-22
        with:
          category: integration
          # Custom Marketplace repository; GitHub Topics are managed separately.
          # Keep all integration/content/security checks enabled.
          ignore: topics

  hassfest:
    name: Home Assistant hassfest
    # GitVerse runners do not expose Docker; GitHub runs the full hassfest gate.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # pinned master at 2026-11-22

  ha_runtime_2026111:
    name: Isolated Home Assistant 2026.11.1 maintenance candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build deterministic component-only archive
        run: |
          python3 scripts/build_release.py --expected-tag v1.0.5 --output "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip"
          sha256sum "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip"
          python3 -m scripts.stage_ha_runtime --archive "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip" --config "$RUNNER_TEMP/venta-ha-config"
      - name: Check synthetic configuration with Home Assistant 2026.11.1
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python -m homeassistant --script check_config --config /config
      - name: Exercise real native HomeKit APIs without device or pairing
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_native_homekit_smoke.py:/tmp/venta-homekit-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python /tmp/venta-homekit-smoke.py --config /config --ha-version 2026.11.1

  ha_runtime_2026112:
    name: Isolated Home Assistant 2026.11.2 maintenance candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build deterministic component-only archive
        run: |
          python3 scripts/build_release.py --expected-tag v1.0.5 --output "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip"
          sha256sum "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip"
          python3 -m scripts.stage_ha_runtime --archive "$RUNNER_TEMP/venta-1.0.5-manual-candidate.zip" --config "$RUNNER_TEMP/venta-ha-config"
      - name: Check synthetic configuration with Home Assistant 2026.11.2
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python -m homeassistant --script check_config --config /config
      - name: Exercise real native HomeKit APIs without device or pairing
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_native_homekit_smoke.py:/tmp/venta-homekit-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python /tmp/venta-homekit-smoke.py --config /config --ha-version 2026.11.2
      - name: Attach temporary candidate ZIP (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: venta-1.0.5-manual-candidate
          path: ${{ runner.temp }}/venta-1.0.5-manual-candidate.zip
          retention-days: 7
          if-no-files-found: error
