name: Validate Venta AW730

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.2,<7"
      - name: Syntax, unit tests and repository structure
        run: |
          python -m compileall -q custom_components tests scripts
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Validate optional dashboard JavaScript
        run: |
          node --input-type=module --check < extras/dashboard/venta-airwasher-card.js
          node --input-type=module --check < extras/dashboard/venta-more-info.js

  hacs:
    name: HACS / Marketplace validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # pinned main at 2026-11-22
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # pinned master at 2026-11-22
