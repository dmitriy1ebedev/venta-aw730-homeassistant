name: Validate Venta AW730

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.2,<7"
      - name: Syntax, unit tests and repository structure
        run: |
          python -m compileall -q custom_components tests scripts
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
          python scripts/check_publication_security.py
      - name: Validate optional dashboard JavaScript
        run: |
          node --input-type=module --check < extras/dashboard/venta-airwasher-card.js
          node --input-type=module --check < extras/dashboard/venta-more-info.js

  hacs:
    name: HACS / Marketplace validation
    # GitVerse has no usable GitHub token for this GitHub-only metadata check.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # pinned main at 2026-11-22
        with:
          category: integration
          # Custom Marketplace repository; GitHub Topics are managed separately.
          # Keep all integration/content/security checks enabled.
          ignore: topics

  hassfest:
    name: Home Assistant hassfest
    # GitVerse runners do not expose Docker; GitHub runs the full hassfest gate.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # pinned master at 2026-11-22

  ha_runtime_smoke:
    name: Disposable Home Assistant 2026.11.1 configuration smoke
    # GitVerse cannot run Docker; this checks the actual HA container on GitHub.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build component-only archive and isolated fake configuration
        run: |
          python3 scripts/build_release.py --output "$RUNNER_TEMP/venta-ci-source.zip"
          python3 -m scripts.stage_ha_runtime --archive "$RUNNER_TEMP/venta-ci-source.zip" --config "$RUNNER_TEMP/venta-ha-config"
      - name: Validate integration with real Home Assistant in disposable container
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python -m homeassistant --script check_config --config /config
      - name: Validate native HomeKit and PyHAP command APIs without pairing
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_native_homekit_smoke.py:/tmp/venta-homekit-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python /tmp/venta-homekit-smoke.py --config /config --ha-version 2026.11.1
      - name: Validate stable HomeKit AID/IID and native non-Venta accessories
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_homekit_identity_smoke.py:/tmp/venta-identity-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python /tmp/venta-identity-smoke.py --config /config --ha-version 2026.11.1
      - name: Validate read-only LocalTuya registry choices against HA 2026.11.1
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_entity_registry_smoke.py:/tmp/venta-registry-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.1 \
            python /tmp/venta-registry-smoke.py --config /config --ha-version 2026.11.1

  ha_patch_smoke:
    name: Disposable Home Assistant 2026.11.2 configuration smoke
    # P02.5 candidate: current HA 2026.11.2, isolated from production and from the baseline job.
    if: ${{ github.repository == 'dmitriy1ebedev/venta-aw730-homeassistant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build component-only archive and isolated fake configuration
        run: |
          python3 scripts/build_release.py --output "$RUNNER_TEMP/venta-ci-source.zip"
          python3 -m scripts.stage_ha_runtime --archive "$RUNNER_TEMP/venta-ci-source.zip" --config "$RUNNER_TEMP/venta-ha-config"
      - name: Validate integration with real Home Assistant in disposable container
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python -m homeassistant --script check_config --config /config
      - name: Validate native HomeKit and PyHAP command APIs without pairing
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_native_homekit_smoke.py:/tmp/venta-homekit-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python /tmp/venta-homekit-smoke.py --config /config --ha-version 2026.11.2
      - name: Validate stable HomeKit AID/IID and native non-Venta accessories
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_homekit_identity_smoke.py:/tmp/venta-identity-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python /tmp/venta-identity-smoke.py --config /config --ha-version 2026.11.2
      - name: Validate read-only LocalTuya registry choices against HA 2026.11.2
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-ha-config:/config:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ha_entity_registry_smoke.py:/tmp/venta-registry-smoke.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python /tmp/venta-registry-smoke.py --config /config --ha-version 2026.11.2
