          import importlib
          import json
          import sys
          from pathlib import Path
          from homeassistant.const import __version__ as ha_version
          from homeassistant.components.humidifier import HumidifierEntity
          from homeassistant.components.select import SelectEntity
          from homeassistant.components.switch import SwitchEntity
          from homeassistant.components.sensor import SensorEntity
          from homeassistant.components.button import ButtonEntity
          from homeassistant.components.fan import FanEntity
          assert ha_version == sys.argv[1], "wrong HA version"
          package = Path("/upstream/custom_components/localtuya")
          manifest = json.loads((package / "manifest.json").read_text())
          assert manifest["version"] == "2026.10.0", "wrong LocalTuya version"
          assert manifest["requirements"] == [], "review new dependencies before testing"
          root = importlib.import_module("custom_components.localtuya")
          assert Path(root.__file__).resolve().parent == package
          assert callable(root.async_setup_entry)
          flow = importlib.import_module("custom_components.localtuya.config_flow")
          dps = ["1 (value: True)", "2 (value: 55)"]
          selector = flow.col_to_select(dps, is_dps=True)
          assert selector("1") == "1" and selector("2") == "2"
          for name, base, cls in (
              ("humidifier", HumidifierEntity, "LocalTuyaHumidifier"),
              ("fan", FanEntity, "LocalTuyaFan"),
              ("select", SelectEntity, "LocalTuyaSelect"),
              ("switch", SwitchEntity, "LocalTuyaSwitch"),
              ("sensor", SensorEntity, "LocalTuyaSensor"),
              ("button", ButtonEntity, "LocalTuyaButton"),
          ):
              module = importlib.import_module("custom_components.localtuya." + name)
              assert Path(module.__file__).resolve().parent == package
              assert issubclass(getattr(module, cls), base), name
              assert isinstance(module.flow_schema(dps), dict), name
          print("LocalTuya 2026.10.0 real imports and synthetic DP selectors PASS on HA", ha_version)
          ' "$HA_VERSION"
