name: Publish verified Venta AW730 v1.2.0 (one-shot)

# A completed, successful push-to-main validation is the only trigger.
# workflow_run can be fired by untrusted PRs: the job excludes them, and
# checks its exact head SHA against the current protected main before writing.
on:
  workflow_run:
    workflows: ["Validate Venta AW730"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: venta-aw730-immutable-v1.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == '49d0c64e4a20421c16729b393fb82cb62de1490f'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exactly the validated main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Assert current protected source and release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          current_main="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          test "$current_main" = "$CI_SHA" || { echo "Main moved since successful CI"; exit 1; }
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          version = json.loads(Path("custom_components/venta_homekit_native/manifest.json").read_text())["version"]
          assert version == "1.2.0"
          assert Path("VERSION").read_text().strip() == version
          assert f"## {version} (" in Path("CHANGELOG.md").read_text()
          for name, label in (("README.md", "Version"), ("README.ru.md", "Версия")):
              source = Path(name).read_text()
              assert re.findall(r"img\.shields\.io/badge/version-(\d+\.\d+\.\d+)-", source) == [version]
              assert f"[![{label} {version}]" in source
          PY
          python3 scripts/check_repository.py
          python3 scripts/check_publication_security.py

      - name: Build immutable component-only archive and provenance
        id: build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/venta-aw730-v1.2.0-manual.zip"
          python3 scripts/build_release.py --expected-tag v1.2.0 --output "$archive"
          digest="$(sha256sum "$archive" | cut -d ' ' -f1)"
          printf '%s  %s\n' "$digest" "venta-aw730-v1.2.0-manual.zip" > "$RUNNER_TEMP/SHA256SUMS.txt"
          printf 'source_commit=%s\nsource_tree=%s\narchive_sha256=%s\n' \
            "$CI_SHA" "$(git rev-parse HEAD^{tree})" "$digest" > "$RUNNER_TEMP/provenance.txt"
          echo "archive_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify isolated installation layout before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.stage_ha_runtime \
            --archive "$RUNNER_TEMP/venta-aw730-v1.2.0-manual.zip" \
            --config "$RUNNER_TEMP/venta-prepublish-config"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-prepublish-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python -m homeassistant --script check_config --config /config

      - name: Create tag only once and publish reviewed release assets
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          # gh api can emit literal "null" on a missing ref before exiting 1.
          # Never swallow that failed request *inside* command substitution.
          existing=""
          if ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/v1.2.0" --jq '.object.sha' 2>/dev/null)"; then
            if [ -z "$ref_sha" ] || [ "$ref_sha" = "null" ]; then
              echo "Invalid tag response; refusing publication"
              exit 1
            fi
            existing="$ref_sha"
          fi
          if [ -n "$existing" ]; then
            test "$existing" = "$CI_SHA" || { echo "Tag exists at a different object; refusing retag"; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/v1.2.0" -f "sha=$CI_SHA" > /dev/null
          fi
          cp docs/RELEASE_NOTES_1_2_0.md "$RUNNER_TEMP/venta-release-notes.md"
          printf '\nSource commit: `%s`\nSource tree: `%s`\nComponent ZIP SHA-256: `%s`\n' \
            "$CI_SHA" "$(git rev-parse HEAD^{tree})" "$ARCHIVE_SHA256" \
            >> "$RUNNER_TEMP/venta-release-notes.md"
          if gh release view v1.2.0 --json tagName >/dev/null 2>&1; then
            echo "Existing v1.2.0 release retained; no overwrite or asset mutation."
          else
            gh release create v1.2.0 \
              "$RUNNER_TEMP/venta-aw730-v1.2.0-manual.zip" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              "$RUNNER_TEMP/provenance.txt" \
              --verify-tag --title "Venta AW730 1.2.0" \
              --notes-file "$RUNNER_TEMP/venta-release-notes.md"
          fi

      - name: Re-download published asset and verify SHA and Home Assistant
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.2.0" --jq '.object.sha')" = "$CI_SHA"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download v1.2.0 --pattern "venta-aw730-v1.2.0-manual.zip" --dir "$RUNNER_TEMP/published"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/published/venta-aw730-v1.2.0-manual.zip" | sha256sum --check
          python3 -m scripts.stage_ha_runtime \
            --archive "$RUNNER_TEMP/published/venta-aw730-v1.2.0-manual.zip" \
            --config "$RUNNER_TEMP/venta-published-config"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 \
            -v "$RUNNER_TEMP/venta-published-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.11.2 \
            python -m homeassistant --script check_config --config /config
